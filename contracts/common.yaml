openapi: 3.1.0
info:
  title: FinTech MLOps — shared components
  version: 1.0.0
  description: |
    Components referenced by every service contract.
    Conventions (§3.10): prefix `/api/v1`, errors as RFC 7807 Problem Details,
    pagination `?page=&size=&sort=`, `X-Correlation-Id` propagated end to end.
paths: {}
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        RS256 access token issued by auth-service (15 min). Claims:
        `sub` (user id), `preferred_username`, `roles` (array of `ADMIN`, `ANALYSTE`, `SIMULATEUR`), `iss`, `iat`, `exp`.
        Validated by the gateway and re-validated by every service (JWKS).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Generated by the gateway if absent, propagated to every call, log line and event.
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }
    Sort:
      name: sort
      in: query
      description: "`field,asc|desc`, repeatable."
      schema: { type: array, items: { type: string } }
      style: form
      explode: true
  schemas:
    ProblemDetail:
      type: object
      description: RFC 7807 error body (Spring `ProblemDetail`).
      required: [title, status]
      properties:
        type: { type: string, format: uri, default: "about:blank" }
        title: { type: string, examples: ["Conflict"] }
        status: { type: integer, examples: [409] }
        detail: { type: string, examples: ["Review already processed by another analyst"] }
        instance: { type: string, examples: ["/api/v1/risk/reviews/3f1c…/decision"] }
        correlationId: { type: string, format: uuid }
        errors:
          type: array
          description: Field-level validation errors (400 only).
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Role:
      type: string
      enum: [ADMIN, ANALYSTE, SIMULATEUR]
    Category:
      type: string
      description: The 14 Sparkov merchant categories.
      enum: [entertainment, food_dining, gas_transport, grocery_net, grocery_pos, health_fitness, home,
             kids_pets, misc_net, misc_pos, personal_care, shopping_net, shopping_pos, travel]
    TransactionStatus:
      type: string
      enum: [EN_ATTENTE, EN_REVUE, APPROUVEE, BLOQUEE]
    DecisionSource:
      type: string
      enum: [AUTO, MANUELLE]
    RiskDecision:
      type: string
      description: Output of the decision policy (§2.5).
      enum: [APPROUVER, REVUE, BLOQUER]
    DecisionReason:
      type: string
      description: |
        MODELE_CONFIANT — singleton prediction set; MODELE_INCERTAIN — set {0,1} or empty;
        ML_INDISPONIBLE — ml-service down/timeout/circuit open (fail-safe);
        CLIENT_INDISPONIBLE — customer profile unavailable and not cached.
      enum: [MODELE_CONFIANT, MODELE_INCERTAIN, ML_INDISPONIBLE, CLIENT_INDISPONIBLE]
  responses:
    BadRequest:
      description: Validation error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Unauthorized:
      description: Missing or invalid JWT
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Forbidden:
      description: Role not allowed (matrix §3.8)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    NotFound:
      description: Resource not found
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    Conflict:
      description: Conflict (optimistic lock, duplicate, wrong state)
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
    ServiceUnavailable:
      description: Overloaded (bounded queue full) or downstream unavailable
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/ProblemDetail' } } }
