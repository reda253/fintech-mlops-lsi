openapi: 3.1.0
info:
  title: customer-service
  version: 1.0.0
  description: |
    Cardholders loaded from Sparkov. Port 8082, schema `customer`.
    The card number is never stored: only an HMAC-SHA256 fingerprint (the card identifier)
    and the last 4 digits for display (§3.4).
servers:
  - url: http://localhost:8082
security:
  - bearerJwt: []
tags:
  - name: customers
  - name: internal
paths:
  /api/v1/customers:
    get:
      tags: [customers]
      summary: List customers (ADMIN, ANALYSTE)
      parameters:
        - $ref: './common.yaml#/components/parameters/Page'
        - $ref: './common.yaml#/components/parameters/Size'
        - $ref: './common.yaml#/components/parameters/Sort'
        - name: name
          in: query
          description: Case-insensitive match on first or last name
          schema: { type: string }
        - name: city
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string, pattern: '^[A-Z]{2}$' }
        - name: cardLast4
          in: query
          schema: { type: string, pattern: '^[0-9]{4}$' }
      responses:
        '200':
          description: Page of customers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerPage' }
        '401': { $ref: './common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
    post:
      tags: [customers]
      summary: Create customer (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCustomerRequest' }
      responses:
        '201':
          description: Created
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '409': { $ref: './common.yaml#/components/responses/Conflict' }
  /api/v1/customers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [customers]
      summary: Get customer (ADMIN, ANALYSTE)
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
    put:
      tags: [customers]
      summary: Update customer profile (ADMIN). The card cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerProfile' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '400': { $ref: './common.yaml#/components/responses/BadRequest' }
        '403': { $ref: './common.yaml#/components/responses/Forbidden' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /internal/customers/lookup:
    post:
      tags: [internal]
      summary: Resolve a card number to its customer (transaction-service only, decision D33)
      description: |
        Not routed by the gateway; the NetworkPolicy allows transaction-service only.
        POST rather than GET so the card number never appears in a URL or access log.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cardNumber]
              properties:
                cardNumber: { type: string, pattern: '^[0-9]{12,19}$', writeOnly: true }
      responses:
        '200':
          description: Customer found
          content:
            application/json:
              schema:
                type: object
                required: [customerId, cardLast4]
                properties:
                  customerId: { type: string, format: uuid }
                  cardLast4: { type: string, pattern: '^[0-9]{4}$' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
  /internal/customers/{id}/risk-profile:
    get:
      tags: [internal]
      summary: Minimal profile used by the model (risk-service only, decision D34)
      description: Only the fields `/predict` needs (data minimisation). Cached 10 min by risk-service.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Risk profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RiskProfile' }
        '404': { $ref: './common.yaml#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Gender:
      type: string
      enum: [M, F]
    CustomerProfile:
      type: object
      required: [firstName, lastName, gender, dob, job, street, city, state, zip, cityPop, lat, long]
      properties:
        firstName: { type: string, maxLength: 64 }
        lastName: { type: string, maxLength: 64 }
        gender: { $ref: '#/components/schemas/Gender' }
        dob: { type: string, format: date }
        job: { type: string, maxLength: 128 }
        street: { type: string, maxLength: 128 }
        city: { type: string, maxLength: 64 }
        state: { type: string, pattern: '^[A-Z]{2}$' }
        zip: { type: string, maxLength: 10 }
        cityPop: { type: integer, minimum: 0 }
        lat: { type: number, minimum: -90, maximum: 90 }
        long: { type: number, minimum: -180, maximum: 180 }
    CreateCustomerRequest:
      allOf:
        - $ref: '#/components/schemas/CustomerProfile'
        - type: object
          required: [cardNumber]
          properties:
            cardNumber: { type: string, pattern: '^[0-9]{12,19}$', writeOnly: true }
    Customer:
      allOf:
        - type: object
          required: [id, cardLast4, createdAt]
          properties:
            id: { type: string, format: uuid }
            cardLast4: { type: string, pattern: '^[0-9]{4}$' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
        - $ref: '#/components/schemas/CustomerProfile'
    CustomerPage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Customer' }
        page: { $ref: './common.yaml#/components/schemas/PageMeta' }
    RiskProfile:
      type: object
      description: Maps 1:1 to the `customer` object of `/predict`.
      required: [customerId, dob, gender, cityPop, lat, long, state]
      properties:
        customerId: { type: string, format: uuid }
        dob: { type: string, format: date }
        gender: { $ref: '#/components/schemas/Gender' }
        cityPop: { type: integer }
        lat: { type: number }
        long: { type: number }
        state: { type: string }
