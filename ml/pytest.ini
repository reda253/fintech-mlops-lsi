[pytest]
# Tests live in ml/tests and import the project as `ml.<module>` (e.g.
# `from ml.tracking_smoke import log_smoke_run`). Running `python -m pytest`
# from inside ml/ does not put the repo root on sys.path, so add it here.
# This keeps the plan's `cd ml && python -m pytest ...` commands working.
pythonpath = ..
