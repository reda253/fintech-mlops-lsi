apiVersion: v1
kind: Namespace
metadata:
  name: netpol-test
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: netpol-test
  labels:
    app: netpol-server
spec:
  nodeSelector:
    kubernetes.io/hostname: fintech-worker
  containers:
    - name: nginx
      image: nginx:alpine
      ports:
        - containerPort: 80
      readinessProbe:
        httpGet:
          path: /
          port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: netpol-test
spec:
  selector:
    app: netpol-server
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: netpol-test
spec:
  nodeSelector:
    kubernetes.io/hostname: fintech-worker2
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sleep", "86400"]
---
