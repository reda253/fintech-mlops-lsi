apiVersion: v1
kind: Secret
metadata:
  name: mlflow-db
  namespace: ml
type: Opaque
stringData:
  # Replace with the real PostgreSQL URI before applying. Never commit a real password.
  # Host: adjust to where P4 deploys PostgreSQL (namespace `data` by convention).
  backend-store-uri: postgresql://mlflow_user:CHANGE_ME@postgres.data.svc.cluster.local:5432/fintech
