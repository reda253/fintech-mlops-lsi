apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml
  labels:
    app: mlflow
spec:
  replicas: 1
  # The artifacts PVC is ReadWriteOnce: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.17.2-full
          imagePullPolicy: IfNotPresent
          command: ["mlflow"]
          args:
            - server
            - --backend-store-uri
            - $(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination
            - /mlartifacts
            - --serve-artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: backend-store-uri
            # MLflow >= 3.17 enables a DNS-rebinding/CORS security middleware
            # that only accepts localhost by default. Allow the Ingress host and
            # the in-cluster Service DNS names used by the pipeline / ml-service.
            - name: MLFLOW_SERVER_ALLOWED_HOSTS
              value: "mlflow.fintech.local,mlflow.ml.svc.cluster.local:*,mlflow.ml.svc:*,mlflow:*,localhost:*,127.0.0.1:*"
            - name: MLFLOW_SERVER_CORS_ALLOWED_ORIGINS
              value: "https://mlflow.fintech.local,http://mlflow.fintech.local"
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              # The `-full` image imports the whole ML stack in both the uvicorn
              # parent and worker processes (~1.9 Gi idle), so 2 Gi still trips
              # the OOM killer. 3 Gi leaves headroom for requests.
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
