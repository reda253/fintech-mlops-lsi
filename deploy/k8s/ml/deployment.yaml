apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml
  labels:
    app: mlflow
spec:
  replicas: 1
  # The artifacts PVC is ReadWriteOnce: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v3.17.2-full
          imagePullPolicy: IfNotPresent
          command: ["mlflow"]
          args:
            - server
            - --backend-store-uri
            - $(MLFLOW_BACKEND_STORE_URI)
            - --artifacts-destination
            - /mlartifacts
            - --serve-artifacts
            - --host
            - 0.0.0.0
            - --port
            - "5000"
          env:
            - name: MLFLOW_BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-db
                  key: backend-store-uri
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: artifacts
              mountPath: /mlartifacts
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: mlflow-artifacts
