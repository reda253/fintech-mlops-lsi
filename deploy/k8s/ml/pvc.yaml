apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlflow-artifacts
  namespace: ml
  labels:
    app: mlflow
spec:
  accessModes:
    - ReadWriteOnce
  # Uses the cluster's default StorageClass (kind: `standard`, backed by the
  # rancher local-path provisioner). Do not hard-code `local-path`: on kind the
  # class is named `standard`.
  resources:
    requests:
      storage: 5Gi
