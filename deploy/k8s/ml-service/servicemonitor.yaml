apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ml-service
  namespace: ml
  labels:
    app: ml-service
    release: prometheus
spec:
  selector:
    matchLabels:
      app: ml-service
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
