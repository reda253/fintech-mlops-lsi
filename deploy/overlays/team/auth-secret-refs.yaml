apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fintech
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-signing
                  key: private-key
            - name: AUTH_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: auth-bootstrap-admin
                  key: username
            - name: AUTH_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-bootstrap-admin
                  key: password
