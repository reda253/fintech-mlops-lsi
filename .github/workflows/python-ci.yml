name: Python CI

on:
  pull_request:
    paths:
      - 'ml/**'
      - 'ml-service/**'
      - 'simulator/**'
      - '.github/workflows/python-ci.yml'
  push:
    branches: [ main ]
    paths:
      - 'ml/**'
      - 'ml-service/**'
      - 'simulator/**'
      - '.github/workflows/python-ci.yml'

jobs:
  lint-and-test:
    name: Lint and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt -r ml/requirements-dev.txt
          pip install -r ml-service/requirements.txt -r ml-service/requirements-dev.txt

      - name: Lint with Ruff
        run: |
          ruff check ml/ ml-service/

      - name: Run ml-service tests
        working-directory: ml-service
        run: |
          pytest -v

      - name: Run ml tests
        run: |
          pytest ml/tests -v

  ml-smoke:
    name: ML Smoke Pipeline
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ml/requirements.txt -r ml/requirements-dev.txt

      - name: Run ML Smoke Pipeline (§5.6)
        run: |
          python -m ml.src.pipeline.smoke
