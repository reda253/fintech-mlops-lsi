name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test restricted deploy bot write guard
        run: python3 -B -m unittest discover -s deploy/bootstrap -p test_ci_bot_write_test.py

      - name: Test Transaction smoke checks and CI isolation guard
        run: python3 -B -m unittest discover -s deploy/bootstrap -p test_transaction_smoke_test.py

      - name: Test Java image verification rules
        run: python3 -B -m unittest discover -s deploy/bootstrap -p test_verify_java_image.py

      - name: Test frontend proxy checks
        run: python3 -B -m unittest discover -s deploy/bootstrap -p test_frontend_smoke_test.py

      - name: Test Kubernetes policy and namespace cleanup guards
        run: python3 -B -m unittest discover -s deploy/bootstrap -p test_kubernetes_manifests.py

      - name: Check repository structure
        run: |
          test -f docker-compose.yml
          test -d deploy
          test -d deploy/bootstrap

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Validate customer Compose config without local secrets
        env:
          CUSTOMER_ENV_FILE: ${{ runner.temp }}/customer-ci.env
        run: |
          touch "$CUSTOMER_ENV_FILE"
          docker compose -f docker-compose.yml -f docker-compose.customer.yml config --no-env-resolution --quiet

      - name: Validate Transaction Compose without local secrets
        env:
          TRANSACTION_ENV_FILE: ${{ runner.temp }}/transaction-config.env
        run: |
          touch "$TRANSACTION_ENV_FILE"
          docker compose -f docker-compose.yml -f docker-compose.transaction.yml config --no-env-resolution --quiet

      - name: Validate frontend and Gateway Compose
        run: docker compose -f docker-compose.yml -f docker-compose.frontend.yml config --quiet

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Git history
        run: |
          git rev-parse HEAD
          git rev-parse --is-shallow-repository
          git log -5 --oneline

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  gateway-image:
    name: Gateway image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build gateway image and run Maven tests
        run: docker build -f services/api-gateway/Dockerfile -t "fintech-api-gateway:$IMAGE_TAG" services

      - name: Scan gateway image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-api-gateway:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  transaction-image:
    name: Transaction image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build transaction image and run Maven tests
        run: docker build -f services/transaction-service/Dockerfile -t "fintech-transaction-service:$IMAGE_TAG" services

      - name: Scan transaction image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-transaction-service:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      - name: Transaction runtime, security, dependency outages and recovery
        run: python3 -B deploy/bootstrap/transaction_compose_ci.py --image "fintech-transaction-service:$IMAGE_TAG"

  frontend-image:
    name: Frontend image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Build frontend with lint, tests and TypeScript compilation
        run: docker build -t "fintech-frontend:$IMAGE_TAG" frontend
      - name: Scan frontend image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-frontend:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
      - name: Set up Node for browser tests
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked test tooling and audit dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npx playwright install --with-deps chromium
      - name: Test Docker frontend, proxy, SSE and desktop/mobile rendering
        run: python3 -B deploy/bootstrap/frontend_compose_ci.py --image "fintech-frontend:$IMAGE_TAG" --browser-tests
      - name: Install pinned kind and matching kubectl with checksums
        run: |
          curl -fsSLo "$RUNNER_TEMP/kind-linux-amd64" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSLo "$RUNNER_TEMP/kind-linux-amd64.sha256sum" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          (cd "$RUNNER_TEMP" && sha256sum --check kind-linux-amd64.sha256sum)
          chmod +x "$RUNNER_TEMP/kind-linux-amd64"
          sudo install "$RUNNER_TEMP/kind-linux-amd64" /usr/local/bin/kind
          curl -fsSLo "$RUNNER_TEMP/kubectl" https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          curl -fsSLo "$RUNNER_TEMP/kubectl.sha256" https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl.sha256
          (cd "$RUNNER_TEMP" && echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check)
          sudo install -m 0755 "$RUNNER_TEMP/kubectl" /usr/local/bin/kubectl
      - name: Create isolated Kubernetes validation cluster
        run: |
          kind create cluster --name fintech-ci --image kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5 --wait 120s
          kubectl --context kind-fintech-ci create namespace fintech
      - name: Validate all application schemas and deployment policies without deploying them
        run: python3 -B deploy/bootstrap/check_kubernetes_manifests.py --context kind-fintech-ci --allow-placeholder
      - name: Build real Gateway for Kubernetes integration
        run: docker build -f services/api-gateway/Dockerfile -t "fintech-api-gateway:$IMAGE_TAG" services
      - name: Test actual Gateway and frontend on Kubernetes
        run: python3 -B deploy/bootstrap/kubernetes_kind_smoke.py --cluster fintech-ci --frontend-image "fintech-frontend:$IMAGE_TAG" --gateway-image "fintech-api-gateway:$IMAGE_TAG"
      - name: Remove CI-owned kind cluster
        if: always()
        run: kind delete cluster --name fintech-ci
      - name: Upload browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-docker-browser-results
          path: frontend/test-results/
          if-no-files-found: warn
          retention-days: 7

  remaining-java-images:
    name: ${{ matrix.label }} image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Auth
            module: auth-service
            port: "8081"
          - label: Risk
            module: risk-service
            port: "8084"
          - label: Notification
            module: notification-service
            port: "8085"
          - label: Audit
            module: audit-service
            port: "8086"
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      SERVICE_MODULE: ${{ matrix.module }}
      SERVICE_PORT: ${{ matrix.port }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Java image and run Maven tests
        run: docker build -f "services/$SERVICE_MODULE/Dockerfile" -t "fintech-$SERVICE_MODULE:$IMAGE_TAG" services

      - name: Verify image metadata and unprivileged runtime
        run: python3 -B deploy/bootstrap/verify_java_image.py --image "fintech-$SERVICE_MODULE:$IMAGE_TAG" --port "$SERVICE_PORT"

      - name: Scan Java image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-${{ matrix.module }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  python-images:
    name: ${{ matrix.label }} image build and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ML service
            context: ml-service
            image: fintech-ml-service
          - label: Simulator
            context: simulator
            image: fintech-simulator
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}
      IMAGE_NAME: ${{ matrix.image }}
      BUILD_CONTEXT: ${{ matrix.context }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build Python image
        run: docker build -t "$IMAGE_NAME:$IMAGE_TAG" "$BUILD_CONTEXT"

      - name: Scan Python image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  customer-image:
    name: Customer image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build customer image and run Maven tests
        run: docker build -f services/customer-service/Dockerfile -t "fintech-customer-service:$IMAGE_TAG" services

      - name: Scan customer image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-customer-service:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
