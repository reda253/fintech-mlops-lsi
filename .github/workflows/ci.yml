name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check repository structure
        run: |
          test -f docker-compose.yml
          test -d deploy
          test -d deploy/bootstrap

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Validate customer Compose config without local secrets
        run: docker compose -f docker-compose.yml -f docker-compose.customer.yml config --no-env-resolution --quiet

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify Git history
        run: |
          git rev-parse HEAD
          git rev-parse --is-shallow-repository
          git log -5 --oneline

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  gateway-image:
    name: Gateway image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build gateway image and run Maven tests
        run: docker build -f services/api-gateway/Dockerfile -t "fintech-api-gateway:$IMAGE_TAG" services

      - name: Scan gateway image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-api-gateway:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

  customer-image:
    name: Customer image build and scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Build customer image and run Maven tests
        run: docker build -f services/customer-service/Dockerfile -t "fintech-customer-service:$IMAGE_TAG" services

      - name: Scan customer image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: fintech-customer-service:${{ env.IMAGE_TAG }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false
