spring:
  application:
    name: audit-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${DB_USER:audit_user}
    password: ${DB_PASSWORD:audit_pwd}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        default_schema: audit
  flyway:
    schemas: audit
    default-schema: audit
    create-schemas: false       # schema + user created by deploy/sql/00_schemas_users.sql
    # DDL runs as the schema owner; the runtime user can only INSERT + SELECT (append-only, section 3.4)
    user: ${FLYWAY_USER:audit_migrator}
    password: ${FLYWAY_PASSWORD:audit_migrator_pwd}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

server:
  port: 8086
  shutdown: graceful            # finish in-flight requests on SIGTERM (§6.8)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
