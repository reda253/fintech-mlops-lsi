spring:
  application:
    name: customer-service
  lifecycle:
    # K8s grace period is 30 s and preStop takes 5 s: finish in-flight requests before SIGKILL (§6.8).
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintech}
    username: ${DB_USER:customer_user}
    password: ${DB_PASSWORD:customer_pwd}
    hikari:
      schema: customer          # plain JDBC (seed) uses the service schema whatever the role's search_path
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # schema is owned by Flyway, never by Hibernate
    properties:
      hibernate:
        default_schema: customer
  flyway:
    schemas: customer
    default-schema: customer
    create-schemas: false       # schema + user created by deploy/sql/00_schemas_users.sql

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}

customer:
  # HMAC-SHA256 key for card fingerprints, >= 32 bytes, from a K8s Secret. No default: the service refuses
  # to start without it. Changing it orphans every stored fingerprint.
  card-hmac-key: ${CARD_HMAC_KEY:}
  # Comma-separated raw Sparkov CSV files loaded at startup when the table is empty (D50). Blank = no seed.
  seed-path: ${CUSTOMER_SEED_PATH:}

server:
  port: 8082
  shutdown: graceful            # finish in-flight requests on SIGTERM (§6.8)

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /readiness
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true    # calls to other services (risk, customer, ml-service)
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
        http.client.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
